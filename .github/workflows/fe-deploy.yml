name: Deploy chatApp FE to Hostinger VPS
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Deploy FE to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          VITE_APP_API_BASE_URL: ${{ secrets.VITE_APP_API_BASE_URL }}
          VITE_WEB3FORM_ACCESS_KEY: ${{ secrets.VITE_WEB3FORM_ACCESS_KEY }}
          VITE_CLOUDINARY_CLOUD_NAME: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          envs: VITE_APP_API_BASE_URL,VITE_WEB3FORM_ACCESS_KEY,VITE_CLOUDINARY_CLOUD_NAME
          script: |
            set -e          # ← Stop immediately if any command fails

            # Fix git safe directory issue
            git config --global --add safe.directory /home/ubuntu/chatApp/chat-APP-FE

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🚀 Deploying Client..."
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            # ── Pull latest code ──
            cd /home/ubuntu/chatApp/chat-APP-FE
            git fetch origin main
            git reset --hard origin/main
            echo "✅ Code updated"

            # ── Go to umbrella folder ──
            cd /home/ubuntu/chatApp

            # ── Overwrite .env.server fresh every deploy ──
            cat > .env.server << EOF
            VITE_APP_API_BASE_URL=${VITE_APP_API_BASE_URL}
            VITE_WEB3FORM_ACCESS_KEY=${VITE_WEB3FORM_ACCESS_KEY}
            VITE_CLOUDINARY_CLOUD_NAME=${VITE_CLOUDINARY_CLOUD_NAME}
            EOF

            echo "✅ .env.server created"

            # ── Rebuild ONLY server ──
            sudo docker compose build client
            sudo docker compose up -d --no-deps client
            echo "✅ Server container restarted"

            sudo docker image prune -f
            echo "✅ Cleanup done"

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🎉 Deployment successful!"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
